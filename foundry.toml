[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.26"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = true
verbosity = 3
fs_permissions = [{ access = "read", path = "./" }, { access = "write", path = "./deployments/" }]

[profile.default.fuzz]
runs = 256

[rpc_endpoints]
robinhood_testnet = "${RPC_URL}"

# See README.md for deployment instructions.
